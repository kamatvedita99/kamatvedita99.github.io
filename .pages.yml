# Settings for Pages CMS (pagescms.org), the editor you'll use on your phone.
# Each block below is one room. The "path" is the folder its entries live in.
# When you add a new room to src/site.ts, copy one of these blocks for it.
content:
  - name: journal
    label: Journal
    type: collection
    path: src/content/entries/journal
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: note
        label: One-line note (optional)
        type: string
      - name: draft
        label: Keep as draft (hidden from the site)
        type: boolean
      - name: body
        label: Entry
        type: rich-text

  - name: letters
    label: Letters I Never Sent
    type: collection
    path: src/content/entries/letters
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: note
        label: One-line note (optional)
        type: string
      - name: draft
        label: Keep as draft (hidden from the site)
        type: boolean
      - name: body
        label: Letter
        type: rich-text

  - name: curious-mind
    label: The Curious Mind
    type: collection
    path: src/content/entries/curious-mind
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: shelf
        label: Shelf
        type: select
        options:
          values: [To read, Books, "Read & remembered"]
      - name: date
        label: Date added
        type: date
      - name: link
        label: Link to the original (optional)
        type: string
      - name: note
        label: One-line note (optional)
        type: string
      - name: draft
        label: Keep as draft (hidden from the site)
        type: boolean
      - name: body
        label: My thoughts (optional)
        type: rich-text

  - name: thank-you-notes
    label: Thank-You Notes
    type: collection
    path: src/content/entries/thank-you-notes
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: note
        label: One-line note (optional)
        type: string
      - name: draft
        label: Keep as draft (hidden from the site)
        type: boolean
      - name: body
        label: The note
        type: rich-text

  - name: kitchen
    label: The Kitchen
    type: collection
    path: src/content/entries/kitchen
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Dish
        type: string
      - name: date
        label: Date cooked
        type: date
      - name: note
        label: One-line verdict (optional)
        type: string
      - name: draft
        label: Keep as draft (hidden from the site)
        type: boolean
      - name: body
        label: How it went, and what to change next time
        type: rich-text
